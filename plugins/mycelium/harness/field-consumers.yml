# Which promise-shaped canvas fields have a consumer, and who it is.
#
# THE RULE, founder-set 2026-08-31, is about PURPOSE and not about mechanism:
#
#   "If the field's purpose is considered, at any stage, by a writer, to be read as part of
#    the pipeline, it is certainly wired. This also means if the field is to be rendered in
#    a more humane form, like a mermaid chart."
#
# So a RENDERER IS A CONSUMER exactly as a checker is, and `human` is a legal answer the
# moment it is DECLARED. What this registry forbids is the undeclared case: a field nobody
# consumes and nobody ever decided shouldn't be consumed.
#
# WHY IT EXISTS. Measured 2026-08-31 across the shipped schemas: 38 promise-shaped fields,
# of which SIX had no consumer of any kind. One of the six — `unlocked_at` — had been added
# HOURS EARLIER, in the release that fixed exactly this class of defect. A date nothing reads
# can never fire, which is `kill_criterion.date`'s bug reproduced inside its own remediation.
# That is why this is a gate and not a note: care did not survive one afternoon.
#
# `unlocked_at` is absent from this file on purpose. It was WIRED rather than ruled — a fired
# unlock now releases the constraint in check_purpose_stance.py, and says so out loud. That
# is the outcome this gate is for; a registry entry is the fallback, not the goal.
#
# HOW TO ADD ONE. `verdict` is the founder's, never the agent's:
#   wired      — a consumer exists; name it in `consumer`
#   human-only — deliberately for a person to read; NOT a pipeline input
#   UNRULED    — baselined, awaiting a ruling. Does not fail the gate; is reported every run.

reviewed:
  - field: dpia_required
    canvas: privacy-assessment
    consumer: scripts/validate_canvas.py#dpia_determination_findings
    verdict: wired
    note: >-
      SURFACED BY SCHEMATISING, 2026-09-01. This field sat in the shipped template with no
      consumer for the life of the canvas. Nothing read it, so the determination could say
      anything and nothing downstream would notice — the loop-that-cannot-close shape again.
      It became visible only when privacy-assessment.yml was given a schema, at which point
      check_field_wiring flagged it and BLOCKED THE PUSH. That is the gate working: the act of
      declaring a field is what exposed that nobody read it.
      RULED WIRED RATHER THAN `consumer: human`, and the reason is the founder rule of
      2026-08-31 — the field's PURPOSE decides. A DPIA determination exists to be acted on;
      it is not a note someone might read.
      WHAT THE CONSUMER CHECKS: a `true` that points at no DPIA at all. That is derived from
      engine/theory-gates.md L3, which names the DPIA document among required evidence at that
      gate. The complementary rule — a `false` must carry a rationale — lives in
      privacy-assessment.schema.json and is labelled there as the SCHEMA AUTHOR'S OWN judgement,
      not doctrine, so it can be struck. Two rules, two homes, neither duplicated: enforcing the
      same rule in two places is the defect this repo keeps finding in itself.
  - field: source_class_target
    canvas: human-tasks
    consumer: scripts/validate_canvas.py#source_class_target_findings
    verdict: wired
    note: >-
      FOUNDER-RULED 2026-08-31 ("wire it properly"). 20 human-tasks declared the KIND of
      evidence they intended to produce — a clean enum, `external_human` — and nothing read it,
      while `check_source_class_fidelity.py` already read the sibling `source_class`. The
      machinery existed and the field was ONE HOP from it, unwired only by omission.
      WHAT IS CHECKED IS THE LOOP, NOT THE LABEL: a COMPLETED task that declared a target
      evidence class should record where that evidence landed. Measured at the ruling: 15
      completed tasks carried the target, 5 recorded a pointer, and TEN declared an intended
      evidence class without ever saying whether they produced it. Pending tasks are exempt —
      a task still running has not produced its evidence yet, and firing on those is how a
      check gets muted.

  - field: derived_at
    canvas: purpose
    consumer: human
    verdict: human-only
    note: >-
      FOUNDER-RULED 2026-08-31 ("Agreed"). `derived_from_hash` sits beside it and IS read by
      check_purpose_stance, and it already answers the question that matters — are these
      properties stale. `derived_at` answers "when", which nothing needs to compute. Recorded so
      the absence of a reader is a decision rather than an omission.

  - field: validation_status_per_dimension
    canvas: jobs-to-be-done
    consumer: human
    verdict: human-only
    note: >-
      RULED BY ITS OWN SCHEMA, not by asking: the field's description already says "Aggregate
      provenance.confidence remains the single number used by gates and threshold calculations;
      this block is for legibility, not gate computation." The intent was declared at the point
      of definition and simply never recorded here. This is what step (d) of the four-step
      new-field rule asks for, done in advance by whoever wrote the schema.

  - field: target_value
    canvas: opportunities, north-star
    consumer: scripts/check_target_progress.py
    verdict: wired
    note: >-
      FOUNDER-RULED 2026-08-31 ("wire it"). It sat beside `current_value` — the two halves of a
      measurement, adjacent in the same object — and NOTHING read either one. The new gate
      computes the gap, and reports "target set, current_value null" as its own state, because a
      target nothing is measured against cannot fail. First run on the dogfood canvas: 8 targets,
      2 measured (the north star reads 0 of 10), 6 not comparable and each said out loud.

  - field: technical_capabilities_required
    canvas: purpose
    consumer: scripts/validate_canvas.py#technical_capability_findings
    verdict: wired
    note: >-
      FOUNDER-ASKED 2026-08-31 to check whether the tcr- ids form a real pattern. THEY DO: six
      entries, each with capability / why_required / substrate_status / fallback_if_absent, and
      `derived_from` links to ai-001..ai-006 that all resolve. Nothing read them, so deleting an
      ai- invariant would have dangled a tcr- link silently.
      WHAT THE INVESTIGATION FOUND UNDERNEATH: `derived_from` is a SYNONYM for the canonical
      `trace.upstream[].target_id`, which appears ZERO times in the entire canvas while
      `derived_from` appears 12 times. The canonical shape has never once been written. So the
      alias was wired rather than the data migrated — adoption beats orthodoxy — and the
      dangling-reference machinery now has edges to check for the first time. Verified by
      breaking one link: it is caught.
      FIRST ATTEMPT WAS WRONG AND THE FOUNDER CAUGHT IT. It was recorded as wired because the
      `derived_from` links INSIDE it had become trace edges — but no script contained the string
      `technical_capabilities_required`, and this release's own new backing-test said so. His
      correction: *"shouldn't the outer field be the one being wired? that's the data object
      being used?"* Right. Traversing generic link attributes inside an object is not the same
      as anything reading the object for what it MEANS.
      NOW READ BY NAME, FOR ITS MEANING: `technical_capability_findings` checks that every
      required capability says what breaks without it (`fallback_if_absent`), and that no row of
      the substrate matrix omits a column its siblings record — a portability claim nobody made
      and nobody can check. The `derived_from` edge wiring stays; it is a second, weaker consumer.
      NOTE FOR A LATER READER: the framework ships `hooks.codex.json` and `hooks.cursor.json`,
      but no capability's `substrate_status` records codex or cursor. The matrix is internally
      consistent, so this check stays silent on it — consistency is not coverage.

  - field: publication_cadence
    canvas: content-metrics
    consumer: null
    verdict: DELETED
    note: >-
      FOUNDER-RULED 2026-08-31 ("Looks deletable, as there's only one usecase"). Every sub-field
      was null — {current, target, classification, measurement_period} — so it was not
      "human-only", it was unfinished. Removed from the schema. Kept in this registry as a
      tombstone so a later agent proposing the same field finds the ruling instead of
      reinventing it, per step (b) of the four-step rule.
