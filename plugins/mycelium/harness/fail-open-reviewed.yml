- id: check_instrument_contract.py@c64529d64a
  verdict: accepted
  reason: >-
    `_parse_date` returning None for an unparseable date is correct AS A HELPER; the
    defect was at a CALL SITE and is fixed rather than accepted. `_expiry` conflated
    "no score_by" with "score_by is garbage", so an instrument carrying
    `score_by: 2026-13-45` was reported as having no scoring date — true of the parse,
    false of the file, and it sends the reader looking for a promise already written
    down. `_scoring_date` now returns a `_MALFORMED` sentinel and names the bad value.
    The byte-identical handler in check_climatic_predictions.py has its own entry, and
    its caller was checked separately: it does not have the conflation.

- id: check_promise_registry_swept.py@6443bce1c4
  verdict: accepted
  reason: >-
    Returns (None, None) when the sweep marker's date does not parse. The caller reads
    a None date as "no sweep recorded" and says so, which is the same thing a reader
    concludes from a marker with a garbled date: nobody can tell when it last ran.
    Absent and unparseable genuinely coincide here.

