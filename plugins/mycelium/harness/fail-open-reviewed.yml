# VERDICTS ON EVERY DEFAULT-ON-EXCEPTION SITE IN THIS TREE.
#
# `check_fail_open.py` finds handlers that swallow an exception and return a benign
# value — anti-pattern #9, absence laundered into a default. It ships REPORT-ONLY and
# stays that way until every site here carries a judgement, because a baseline seeded
# without reading the code is the tolerated-debt concession `ruff.toml` forbids.
#
# THE ID IS `basename@<content hash of the handler>`. Three consequences, all live in
# this file:
#   1. An edited handler gets a NEW id and returns as unreviewed. That is correct — the
#      verdict was about the old code.
#   2. Byte-identical handlers in the SAME file share one id, so one verdict covers
#      several sites and must be true of all of them (`16080a068f` covers two sites in
#      validate_canvas.py; `5b94899e0a` covers two in session-start.sh).
#   3. Byte-identical handlers in DIFFERENT files do NOT share an entry, because the
#      basename is part of the id. This was written the wrong way round on the first
#      pass of this file — three entries were assumed covered by a twin elsewhere, and
#      check_fail_open reported them as still NEW. The check caught the register.
#
# VERDICTS:
#   accepted     — the silence is correct and the reason says why.
#   conditional  — correct ONLY while a named condition holds. The condition is stated
#                  and its status recorded. This is not a softer "accepted"; it is a
#                  claim someone can go and check.
#   FIXED <date> — it was a real fail-open. What it used to do is recorded, because a
#                  register that only lists survivors teaches nothing.
