- id: correction_attribution_guard.py@acaefd6129
  verdict: accepted
  reason: >-
    A classifier failure returns [] and cannot print: stdout is the hook's protocol
    channel, so a diagnostic there would be parsed as a hook decision. The narrower
    remedy — stderr — is UNEXPLORED rather than ruled out, and is recorded here as the
    open question rather than silently treated as impossible. Accepted because a guard
    that blocks a write when its own classifier throws is worse than one that misses a
    finding.

